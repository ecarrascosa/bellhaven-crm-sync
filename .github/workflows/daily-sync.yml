name: Daily Bellhaven CRM Sync

on:
  schedule:
    # Run daily at 6:00 AM UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Run matcher
        env:
          BELLHAVEN_API_TOKEN: ${{ secrets.BELLHAVEN_API_TOKEN }}
        run: python matcher.py

      - name: Upload proposals artifact
        uses: actions/upload-artifact@v4
        with:
          name: proposals-${{ github.run_number }}
          path: data/proposals.json

      # Proposals require human review in the local app.
      # Download artifact, place in data/, run: python server.py

      - name: Commit decisions state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/decisions.json data/communities.json || true
          git diff --cached --quiet || git commit -m "chore: update sync data [skip ci]"
          git push || true
